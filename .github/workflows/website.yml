name: Deploy website

# Build and deploy the Astro + Starlight site in ./website/ to GitHub
# Pages. Triggers on any push to main that touches the website source,
# the flat *.md docs the importer pulls from, or this workflow file.
#
# Pages action pattern — configure-pages → upload-pages-artifact →
# deploy-pages. Official path for GitHub Pages deploys from a custom
# build. See:
# https://docs.github.com/en/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site#publishing-with-a-custom-github-actions-workflow

on:
  # No `paths:` filter — but be aware the push trigger below does NOT work
  # on this repo, and removing the filter did not fix it.
  #
  # Symptom: across 43 runs going back to June, every one is a
  # workflow_dispatch. Not a single push event, and not a single scheduled
  # run either, despite the weekly cron below. The site rebuilds ONLY when
  # GitLab CI dispatches it (see trigger-github-pages in .gitlab-ci.yml).
  #
  # The `paths:` filter was the obvious suspect and is now ruled out: the
  # commit that removed it also modified THIS FILE, which the old filter
  # explicitly matched, so that push should have fired under either version.
  # It fired under neither. Filter removed anyway (harmless, and it is not
  # wanted once triggers work), but the real cause is still unknown.
  #
  # Ruled out so far: workflow state is `active`; repo is public, not
  # archived, not disabled, default_branch=main; scripts/publish-to-github.sh
  # is byte-identical to ContextAnxiety-site's, which mirrors with the SAME
  # site-group GITHUB_TOKEN and does get push events every time.
  #
  # Consequence: deploys depend on GH_PAT staying valid alongside
  # GITHUB_TOKEN. Rotating one and not the other leaves ctxone.com stale
  # behind a green pipeline — which is exactly what happened on 2026-09-05.
  push:
    branches: [main]
  # Allow manual runs from the Actions tab for one-off redeploys
  # (e.g. after a brand asset swap that doesn't touch source).
  workflow_dispatch:
  # Weekly rebuild so date-gated blog posts enter the STATIC (crawlable)
  # HTML on their pubDate. Client-side JS already reveals a scheduled
  # post to live visitors on its date, but search engines see the HTML
  # produced at build time — so without a rebuild a new post is invisible
  # to crawlers until the next content push. Posts are dated on Thursdays;
  # 00:15 UTC Thursday rebuilds right after that week's post goes live.
  # (GitHub may delay scheduled runs under load; same-day is the intent,
  # not a hard SLA.)
  schedule:
    - cron: '15 0 * * 4'

# Ensure only one deploy runs at a time. A new push to main during an
# in-flight build will queue behind the current one rather than fight
# for the Pages artifact slot.
concurrency:
  group: website-pages
  cancel-in-progress: false

# Pages write + id-token write are required by the official
# deploy-pages action. contents: read is enough for the checkout.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build
        # npm run build runs scripts/import-docs.mjs as a prebuild hook
        # so the imported docs tree under src/content/docs/ is
        # populated from ../*.md before `astro build` runs.
        run: npm run build
        env:
          # Astro picks this up for the `site` config. Overriding here
          # belts-and-braces the canonical URL in case we ever move to
          # a staging preview domain.
          SITE: https://ctxone.com

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
