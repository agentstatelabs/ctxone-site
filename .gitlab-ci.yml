# CI for CTXone-docs (Astro docs site in website/)
stages:
  - build

build-docs:
  stage: build
  image: node:22-bookworm
  cache:
    key:
      files:
        - website/package-lock.json
    paths:
      - website/node_modules/
  script:
    - cd website
    - npm ci
    - npm run build
  artifacts:
    paths:
      - website/dist/
    expire_in: 1 week

# Belt-and-braces dispatch of the GitHub Pages build.
#
# This job is NOT belt-and-braces. It is the only thing that deploys
# ctxone.com. The push trigger in website.yml has never fired: 43 runs since
# June, all workflow_dispatch, no push events and no scheduled runs.
#
# The original comment blamed mirror pushes for not triggering Actions. That
# is wrong — ContextAnxiety-site mirrors with the same byte-identical script
# and the same site-group GITHUB_TOKEN, and its push events fire every time.
# The `paths:` filter on website.yml was the next suspect and is also ruled
# out: the commit removing it modified website.yml itself, which the old
# filter matched, and still produced no run. Cause remains unknown.
#
# allow_failure keeps a stale GH_PAT from redding the pipeline or blocking
# the mirror — but note that a failure here now means the site silently does
# not deploy, so do not read a green pipeline as a published site.
#
# GH_PAT must be rotated in lockstep with GITHUB_TOKEN. Letting them drift is
# what broke deploys on 2026-09-05: the mirror was repaired while dispatch
# kept 401ing, so ctxone.com served a 10-day-old build behind green CI.
trigger-github-pages:
  stage: .post
  image: curlimages/curl:latest
  allow_failure: true
  # Run AFTER publish-github mirrors main to GitHub — otherwise this dispatch
  # races the mirror and the Action rebuilds stale content (as it did once).
  needs: ["publish-github"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $GITHUB_REPO'
  script:
    - |
      curl -fsS -X POST \
        -H "Authorization: Bearer $GH_PAT" \
        -H "Accept: application/vnd.github+json" \
        https://api.github.com/repos/agentstatelabs/ctxone-site/actions/workflows/website.yml/dispatches \
        -d '{"ref":"main"}'
    - echo "Dispatched website.yml on agentstatelabs/ctxone-site"
# --- added by batch-publish-sites: leak-scan-gated publish to GitHub ---
# Uses reserved stage .post (no need to touch the existing stages list).
# Requires CI vars GITHUB_REPO, GITHUB_TOKEN, and file-var LEAKSCAN_LOCAL.
publish-github:
  stage: .post
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $GITHUB_REPO'
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git bash grep curl
  script:
    - printf '%s' "$LEAKSCAN_LOCAL" > .leakscan.local
    - chmod +x scripts/leak-scan.sh scripts/publish-to-github.sh
    - ./scripts/publish-to-github.sh
# ci-guard: guarantees a NON-EMPTY pipeline and fails loudly if the publish
# prerequisites are missing. Without this, a mis-scoped publish job produces
# no pipeline at all — silent, and easy to miss for days.
ci-guard:
  stage: build
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "pipeline ran for $CI_COMMIT_SHORT_SHA on $CI_COMMIT_BRANCH"
    - |
      if [ -z "$GITHUB_REPO" ]; then
        echo "ERROR: GITHUB_REPO unset -> publish-github will NOT run"; exit 1
      fi
      echo "publish-github target: $GITHUB_REPO"
