# CI for CTXone-docs (Astro docs site in website/)
stages:
  - build

build-docs:
  stage: build
  image: node:22-bookworm
  cache:
    key:
      files:
        - website/package-lock.json
    paths:
      - website/node_modules/
  script:
    - cd website
    - npm ci
    - npm run build
  artifacts:
    paths:
      - website/dist/
    expire_in: 1 week

# NOTE: there is deliberately no dispatch job here any more.
#
# ctxone.com used to deploy ONLY because GitLab CI poked the GitHub Pages
# workflow over the API, using a second credential (GH_PAT) that had to be
# rotated in lockstep with GITHUB_TOKEN. On 2026-09-05 they drifted: the
# mirror was repaired while dispatch kept returning 401, so the site served a
# 10-day-old build behind a fully green pipeline.
#
# The underlying fault was a wedged GitHub workflow registration — 45 runs,
# every one a workflow_dispatch, no push and no scheduled run ever, while
# GitHub was demonstrably receiving the pushes. Renaming website.yml to
# deploy-website.yml (4d819b3) forced a fresh registration and push triggers
# started working immediately; both the push run and the dispatch run for that
# commit succeeded.
#
# The mirror push alone now deploys the site, so GH_PAT is no longer used by
# any job here and can be deleted from the site group.
#
# --- added by batch-publish-sites: leak-scan-gated publish to GitHub ---
# Uses reserved stage .post (no need to touch the existing stages list).
# Requires CI vars GITHUB_REPO, GITHUB_TOKEN, and file-var LEAKSCAN_LOCAL.
publish-github:
  stage: .post
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $GITHUB_REPO'
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git bash grep curl
  script:
    - printf '%s' "$LEAKSCAN_LOCAL" > .leakscan.local
    - chmod +x scripts/leak-scan.sh scripts/publish-to-github.sh
    - ./scripts/publish-to-github.sh
# ci-guard: guarantees a NON-EMPTY pipeline and fails loudly if the publish
# prerequisites are missing. Without this, a mis-scoped publish job produces
# no pipeline at all — silent, and easy to miss for days.
ci-guard:
  stage: build
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "pipeline ran for $CI_COMMIT_SHORT_SHA on $CI_COMMIT_BRANCH"
    - |
      if [ -z "$GITHUB_REPO" ]; then
        echo "ERROR: GITHUB_REPO unset -> publish-github will NOT run"; exit 1
      fi
      echo "publish-github target: $GITHUB_REPO"
